name: Verify extension

on:
  push:
    branches: [main, fix/startup-license-mobile-flow, fix/final-startup-verification]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for f in $(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path './.git/*'); do node --check "$f"; done
      - name: Validate startup architecture and integrity
        run: node scripts/verify-startup-architecture.mjs
