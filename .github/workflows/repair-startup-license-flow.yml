name: Repair startup license flow

on:
  push:
    branches: [fix/startup-license-mobile-flow]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply repair
        run: node scripts/repair-startup-license-flow.mjs
      - name: Verify repair
        run: |
          for f in $(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path './.git/*'); do node --check "$f"; done
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if(!m.options_ui?.page) throw new Error('options page missing'); if(!m.host_permissions.includes('https://kfs-keymaster.lovable.app/*')) throw new Error('Keymaster host permission missing'); console.log('manifest OK')"
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js content/gate.js content/license-gate.js license.html manifest.json popup.css scripts/apply-keymaster-licensing.mjs .github/workflows/verify-extension.yml
          if git diff --cached --quiet; then
            echo "Repair already applied"
            exit 0
          fi
          git commit -m "fix: harden startup and license flow"
          git push origin HEAD:fix/startup-license-mobile-flow
